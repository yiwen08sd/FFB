
nc: 3
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv,      [64, 3, 2]]      # 0  P1/2
  - [-1, 1, Conv,      [128, 3, 2]]     # 1  P2/4
  - [-1, 3, C2f,       [128, True]]     # 2
  - [-1, 1, Conv,      [256, 3, 2]]     # 3  P3/8
  - [-1, 6, C2f,       [256, True]]     # 4  <- P3 tap
  - [-1, 1, Conv,      [512, 3, 2]]     # 5  P4/16
  - [-1, 6, C2f,       [512, True]]     # 6  <- P4 tap
  - [-1, 1, Conv,      [1024, 3, 2]]    # 7  P5/32
  - [-1, 3, C2f_DRB,   [1024, True]]    # 8  <- DRB Injected Here
  - [-1, 1, SPPF,      [1024, 5]]       # 9

head:
  - [[4, 6, 9],  1, BiFPNCore, [256, 3]]      # 10 fuses P3, P4, P5
  - [10,         1, BiFPNRead, [0]]           # 11 fused P3
  - [10,         1, BiFPNRead, [1]]           # 12 fused P4
  - [10,         1, BiFPNRead, [2]]           # 13 fused P5
  - [-1,         1, SwinNeckBlock, [4, 8]]    # 14 Swin Block on fused P5
  - [[11, 12, 14], 1, OBB, [nc, 1]]           # 15 OBB head
